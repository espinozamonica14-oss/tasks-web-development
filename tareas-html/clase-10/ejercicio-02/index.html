<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario estructurado</title>
</head>
<body>
    <header>
    <a href="../index.html">← Volver al inicio</a>
    <hr>  
    </header>
    <main>
        <h1>Formulario Estructurado</h1>
        <form action="#" method="get">
            <fieldset>
            <legend>Datos personales</legend>
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="apellidos">Apellidos</label><br>
            <input type="text" id="apellidos" name="apellidos"><br><br>

            <label for="dni">DNI</label><br>
            <input type="text" id="dni" name="dni"><br><br>
           </fieldset>
           
           <fieldset>
            <legend>Datos de conexión</legend>
            <label for="usuario">Nombre de usuario</label><br>
            <input type="text" id="usuario" name="usuario"><br><br>
            <label for="contrasenia">Contraseña</label><br>
            <input type="text" id="contrasenia" name="contrasenia"><br><br>
            <label for="pass_confirm">Repite la Contraseña</label><br>
            <input type="text" id="pass_confirm" name="pass_confirm"><br><br>
           </fieldset>
           <button type="submit">Enviar</button>
        </form>
    </main>  
   <hr>

        @2026 todos los derechos reservados
    </footer>
</body>

</html>
